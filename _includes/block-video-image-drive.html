<div class="video-image-block full-width">
    <div class="video-wrapper">
        <div class="video-responsive">
            <iframe src="{{ include.video }}" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>
    <div class="image-wrapper drive-video-preview">
        <a href="#" class="drive-video-trigger" data-video="{{ include.vertical_video }}">
            <img src="{{ site.baseurl }}{{ include.image }}" alt="Video preview">
            <span class="overlay"></span> <span class="play-icon"></span>
        </a>
    </div>
</div>
